# 方案 B：自建 Redis（元数据 + 限流）+ 自建 Qdrant（向量库）
#
# 注意：这里**不写 container_name**。固定名字会让同一份 compose 在多个目录
# （比如原项目和演练克隆）里互相抢占，报 "container name is already in use"。
# 交给 compose 按项目名自动命名（rag-redis-1 / rag-drill-redis-1），互不干扰。
# 启动：docker compose up -d
# 停止：docker compose down
# 连数据一起清掉：docker compose down -v

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    # appendonly 开启 AOF，重启不丢元数据
    command: redis-server --appendonly yes
    # 生产：把上面一行换成下面这行，并在 .env（不入库）里设置 REDIS_PASSWORD
    # command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333' # REST（本项目的 @qdrant/js-client-rest 走这个）
      - '6334:6334' # gRPC（本项目用不到，留着你以后调）
    volumes:
      - qdrant_data:/qdrant/storage
    # 生产：开启 API Key（与 .env 的 QDRANT_API_KEY 保持一致）
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}

volumes:
  redis_data:
  qdrant_data:
